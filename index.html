<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de photos interactive</title>
    <script src="Photo_Gallery.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <h1>Galerie de photos</h1>
    <div id="image" aria-live="polite">Hover over an image below to display here.</div>
    <div id="gallery">
        <img src="https://images.unsplash.com/photo-1783936093098-2daf9e8ef72e?q=80&amp;w=1974&amp;auto=format&amp;fit=crop&amp;ixlib=rb-4.1.0&amp;ixid=NHwxMjA3fDA%3D"
            alt="A black and white border collie standing on"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?q=80&amp;w=662&amp;auto=format&amp;fit=crop&amp;ixlib=rb-4.1.0&amp;ixid=NHwxMjA3fDA%3D"
            alt="A golden retriever puppy sitting on a stone patio"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://images.unsplash.com/photo-1503256207526-0d5d80fa2f47?q=80&amp;w=686&amp;auto=format&amp;fit=crop&amp;ixlib=rb-4.1.0&amp;ixid=NHwxMjA3fDA%3D"
            alt="A black and white border collie with its mouth open and ears up"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://plus.unsplash.com/premium_photo-1676389281733-aaefab0e7907?q=80&amp;w=686&amp;auto=format&amp;fit=crop&amp;ixlib=rb-4.1.0&amp;ixid=NHwxMjA3fDA%3D"
            alt="A white dog with black patches "
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

        <img src="https://plus.unsplash.com/premium_photo-1666777247416-ee7a95235559?q=80&amp;w=687&amp;auto=format&amp;fit=crop&amp;ixlib=rb-4.1.0&amp;ixid=NHwxMjA3fDA%3D"
            alt="A golden retriever with its tongue out"
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">
        <img src="https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?q=80&w=1976&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="Golden Dog retriever out."
            onmouseover="upDate(this)" onmouseout="undo()"
            onfocus="upDate(this)" onblur="undo()">

    </div>

</body>

</html>
